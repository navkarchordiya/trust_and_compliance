# Every rule, limit and output field lives here, so changing a rule
# is a config edit, not a code change.

[crustdata]
base_url = "https://api.crustdata.com"
api_version = "2025-11-01"
enrich_fields = ["basic_info", "headcount.total", "headcount.growth_percent", "locations",
                 "hiring.openings_count", "news", "people.founders", "people.cxos", "metadata"]
# metadata.updated_at / indexed_at is the record's refresh date when Crustdata fills it (null for Delhivery, 22 Nov)
# Nested paths keep the response small: plain "people" returns ~300 decision makers (5.5 MB).

[limits]
max_credits_per_run = 40       # Crustdata credits; a run stops calling sources past this
max_seconds_per_run = 300
http_timeout_s = 25
max_retries = 3                # per call, on timeout / 5xx / 429
backoff_s = 2.0
reserve_credits_for_news = 1   # under a tight budget, skip the homepage GSTIN read before the news search

[credit_estimates]             # used only when a response has no X-Credits-Used header (ledger marks these "estimated")
"/company/identify" = 0.2   # docs say free, but the live ledger charged 0.2 per matched lookup (22 Nov)
"/company/enrich" = 2
"/person/enrich" = 1
"/web/search/live" = 1
"/web/enrich/live" = 1
"rdap" = 0
"/gstin" = 0
"/job/search" = 0.09           # 0.03 per listing returned, 3 listings

[activity]                     # "is it active NOW": dated job postings (Crustdata Job Search)
enabled = true
max_listings = 3
recent_days = 180              # a posting or news article newer than this is dated proof of activity
require_recent_activity = true   # "real and ACTIVE": approving also needs a dated record newer than recent_days
# as_of = "2026-11-22"         # pin "today" (tests and replays); default is the real date

[identity]
min_confidence = 0.7           # Identify confidence below this = not resolved
ambiguity_gap = 0.05           # two candidates closer than this = ambiguous (lookalike)
min_name_similarity = 0.6      # requested name vs record name
name_only_min_similarity = 0.85  # with no website, a name match below this is not accepted (lookalike risk)

[age]
young_domain_days = 180        # domain younger than this is a weak signal
age_mismatch_years = 3         # claimed founding year older than domain by this = strong signal
young_company_years = 1        # CIN shows incorporation this recently (years) = weak signal

[domain]
fallback_via_web_fetch = true  # RDAP down: read the same RDAP record through Crustdata Web Fetch (1 credit)
# A registrant "organisation" that is a privacy service or a redaction says nothing about who owns the site.
privacy_markers = ["privacy", "redacted", "proxy", "withheld", "whoisguard", "domains by proxy", "not disclosed",
                   "data protected", "contact privacy", "perfect privacy"]

[operating]
min_headcount = 3              # fewer visible employees than this = weak signal

[people]
max_leaders = 3                # founders first, then CXOs
min_founder_connections = 10  # seen live: Blue Dart's listed "founder" has 0 connections (self-declared)
min_connections = 50           # CXOs below this are usually junk self-reported titles (seen: "reus zxz, Ceo")

[media]
max_results_per_query = 10
max_articles_fetched = 4
country = "IN"
query_terms = ["fraud", "scam", "arrested", "raid", "\"shell company\"", "FIR", "jail"]
adverse_terms = ["jail", "sentenced", "fir", "eow", "cbi", "probe", "contempt", "fraud", "scam", "arrested", "arrest", "raid", "cheating", "money laundering",
                 "shell company", "fake invoice", "fake gst", "chargesheet", "absconding",
                 "insolvency", "ponzi", "sebi order", "enforcement directorate", "ed raid"]

# Articles where the vendor is the victim or is being impersonated are not adverse news about it.
# Seen live (22 Nov): most "Blue Dart" fraud news is scams run IN ITS NAME ("using fake Blue Dart courier
# identity", "fraud in the name of courier company Blue Dart"), often in Hindi.
victim_context = ["impersonat", "posing as", "in the name of", "pretending to be", "beware of fake",
                  "fake agent", "fake customer care", "fake helpline", "duped by fake", "cheated by fake",
                  "के नाम पर", "फर्जी एजेंट"]
# Only phrases that mean "someone pretended to be the vendor". Crime words ("cyber fraud", "phishing",
# "fraudsters") are NOT here: an article can use them about the vendor itself (independent review, 22 Nov).
# The pattern "fake <vendor name>" (e.g. "using fake Blue Dart courier identity") is matched in code.
# Words that appear in news about victims as often as about wrongdoers. They never link news to a vendor on
# their own; a sentence also needs a clear accusation word. Seen live: "Xpressbees hub manager assaulted ...
# police files FIR" (Xpressbees was the victim).
ambiguous_terms = ["fir", "probe", "eow", "cbi", "contempt"]
# Non-English adverse words (matched as text, since Devanagari has no reliable word boundary).
adverse_terms_hi = ["गिरफ्तार", "धोखाधड़ी", "घोटाला", "छापा", "छापेमारी", "फ्रॉड", "अरेस्ट", "मनी लॉन्ड्रिंग"]

[registry]
# A GSTIN comes from the request (--gstin, as on an onboarding form) or else from the vendor's own website, checked with the GSTIN checksum, then (if a
# provider key is set in .env) verified against the GST registry.
website_paths = [""]           # homepage only: big firms rarely print a GSTIN (checked live), so keep it cheap
try_www_first = true           # seen live: https://delhivery.com fails (certificate) while https://www.delhivery.com works
max_pages = 1
# Off until there are production keys: the sandbox returns canned test answers, and a registry answer
# can be a strong red flag, so sandbox data must never decide a real vendor (mock data is for tests only).
provider = "none"              # "cashfree" or "none"; cashfree needs CASHFREE_CLIENT_ID / CASHFREE_CLIENT_SECRET
cashfree_base_url = "https://sandbox.cashfree.com/verification"   # production: https://api.cashfree.com/verification
min_legal_name_similarity = 0.6

[cost]
# Rupee cost of one Crustdata credit. ASSUMPTION: replace with your plan's rate (dashboard, or
# GET /account/endpoints). Used only to show the cost of each job in rupees.
inr_per_credit = 8.0
gst_inr_per_call = 1.0         # ASSUMPTION: per-call price of the GST verification API

[approvals]
# Who may approve or decline. Empty = any named person (the name is always recorded).
# For the client: list the compliance approvers, e.g. ["Asha Rao", "Vikram Shah"].
approvers = []

[privacy]
retention_days = 30            # `purge` deletes raw responses (people's profiles) of closed jobs after this

[verdict]
strong_signals_for_front = 2   # this many independent strong signals = FRONT_SUSPECTED
weak_signals_for_review = 2    # a resolved firm with this many weak signals goes to a person (not "cannot verify")

[output]
# Fields included in the result. Add/remove here when the output format changes.
fields = ["job_id", "request", "verdict", "recommended_action", "approval",
          "who_runs_it", "how_long_it_has_existed", "is_trading", "looks_off",
          "cannot_verify", "registry", "latest_activity", "facts", "cost"]
